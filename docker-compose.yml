services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - jarvis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $\$POSTGRES_USER -d $\$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  jarvis-finance:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      JARVIS_DB_AUTO_MIGRATE: "true"
      # Keep the database optional at the application layer until the live-capital phase.
      JARVIS_DB_REQUIRED: "false"
      JARVIS_PAPER_STATE_FILE: /app/data/paper-runtime.json
      # Keep this false until the paper strategy has completed validation.
      JARVIS_PAPER_AUTOSTART: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - jarvis-paper-data:/app/data
    stop_grace_period: 30s

volumes:
  jarvis-paper-data:
  jarvis-postgres-data:
