<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shieldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#262626" stroke-width="4"/>
  
  <!-- Shield Symbol -->
  <path d="M256 96 L376 144 C376 264 256 360 256 360 C256 360 136 264 136 144 Z" fill="none" stroke="url(#shieldG)" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- Candlestick chart pulse -->
  <line x1="200" y1="180" x2="200" y2="280" stroke="#34d399" stroke-width="6"/>
  <rect x="190" y="200" width="20" height="56" rx="4" fill="#10b981"/>
  
  <line x1="256" y1="160" x2="256" y2="300" stroke="#34d399" stroke-width="6"/>
  <rect x="246" y="180" width="20" height="84" rx="4" fill="#34d399"/>
  
  <line x1="312" y1="170" x2="312" y2="290" stroke="#34d399" stroke-width="6"/>
  <rect x="302" y="210" width="20" height="52" rx="4" fill="#10b981"/>
  
  <!-- Exponential growth trendline -->
  <path d="M160 300 Q 220 280, 270 230 T 360 160" fill="none" stroke="#6ee7b7" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Arrow Head -->
  <polygon points="360,160 334,166 354,186" fill="#6ee7b7"/>

  <!-- Subtitle Text -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="28" font-weight="800" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">SURVIVAL BOT</text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="16" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="2">AUTONOMOUS 24/7</text>
</svg>
